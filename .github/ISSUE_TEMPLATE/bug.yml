name: Problema
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versão do Clipey
      placeholder: "1.13.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava e o que aconteceu
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico
      description: "Bandeja → Salvar diagnóstico; anexe o arquivo."
